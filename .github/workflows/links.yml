name: Link check

# Verifies every link/citation across the handbook still resolves.
# Runs on changes, on every PR, and weekly to catch link-rot.
#
# On timeouts: zenodo.org is CERN-hosted and answers slowly enough from GitHub's
# runners to trip lychee's 20s default, intermittently -- the same links passed
# on 2026-09-06 and failed on 2026-09-08/09. Verified alive by hand from a
# residential connection on 2026-09-09: the DOI resolves 200 in ~2.2s across
# three consecutive requests, and the badge returns a real SVG in 0.7s.
#
# The DOI badge and the "cite this work" links are the most load-bearing links
# in a repository whose whole point is citability, so they get a longer timeout
# and a slower retry rather than an entry in .lycheeignore, which would stop
# checking them altogether. A slower check that still checks beats a fast one
# that has quietly stopped looking.

on:
  push:
    branches: [main]
    paths: ['**/*.md']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The DOI is registered and resolves, according to the registry
        # Zenodo's web front end answers slowly from datacenter IPs and was
        # down (504 on every page) for about five hours on 2026-09-13, so the
        # link checker cannot be the judge of the DOI: it reports a timeout on
        # a citation that is perfectly alive. DataCite is the registry the DOI
        # lives in. If it says the DOI is `findable` and points at zenodo.org,
        # the citation resolves; if it ever stops saying so, this fails. The
        # doi.org link is therefore excluded from lychee (see .lycheeignore)
        # and checked here on every run, against the registry itself.
        run: |
          set -euo pipefail
          dois=$(grep -ohE '10\.5281/zenodo\.[0-9]+' CITATION.cff README.md llms.txt about.jsonld 2>/dev/null | sort -u || true)
          if [ -z "$dois" ]; then
            echo "::error::no Zenodo DOI found in CITATION.cff / README.md / llms.txt / about.jsonld -- nothing was checked"
            exit 1
          fi
          for doi in $dois; do
            json=$(curl -sS --max-time 30 -H 'Accept: application/vnd.api+json' "https://api.datacite.org/dois/$doi" || true)
            state=$(printf '%s' "$json" | jq -r '.data.attributes.state // "missing"' 2>/dev/null || echo "unparseable")
            url=$(printf '%s' "$json" | jq -r '.data.attributes.url // ""' 2>/dev/null || echo "")
            case "$state:$url" in
              findable:https://zenodo.org/*) echo "ok  $doi -> $url ($state)" ;;
              *) echo "::error::DOI $doi is not a findable Zenodo DOI according to DataCite (state=$state url=$url)"; exit 1 ;;
            esac
          done

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 2
            --timeout 30
            --retry-wait-time 5
            --accept 200,201,204,206,403,429
            './**/*.md'
          fail: true
